# =====================================================================================
# CSME ERP — configuration de l'API.
# Tous les secrets viennent de variables d'environnement ; aucun n'a de valeur par défaut
# utilisable en production. Voir README.md, section « Configuration ».
# =====================================================================================
spring:
  application:
    name: csme-erp-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${CSME_DB_URL:jdbc:postgresql://localhost:5432/csme}
    # Rôle d'exécution : ni superutilisateur ni propriétaire, pour que PostgreSQL RLS s'applique.
    username: ${CSME_DB_APP_USER:csme_app}
    password: ${CSME_DB_APP_PASSWORD:}
    hikari:
      maximum-pool-size: ${CSME_DB_POOL_SIZE:20}
      auto-commit: true
  flyway:
    # Les migrations s'exécutent avec le rôle propriétaire du schéma, sur leur propre connexion
    # (URL explicite : la source de données de l'application est enveloppée par TenantAwareDataSource).
    url: ${CSME_DB_URL:jdbc:postgresql://localhost:5432/csme}
    user: ${CSME_DB_OWNER_USER:csme_owner}
    password: ${CSME_DB_OWNER_PASSWORD:}
    locations: classpath:db/migration
    placeholders:
      app_role: ${CSME_DB_APP_USER:csme_app}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

csme:
  security:
    jwt:
      secret: ${CSME_JWT_SECRET:}
      issuer: csme-erp
      access-token-ttl: 15m
      refresh-token-ttl: 12h
  bootstrap:
    super-admin-email: ${CSME_BOOTSTRAP_ADMIN_EMAIL:}
    super-admin-password: ${CSME_BOOTSTRAP_ADMIN_PASSWORD:}
  reporting:
    time-zone: ${CSME_REPORTING_TIME_ZONE:UTC}

logging:
  level:
    root: INFO
    com.csme: INFO
